; ESP32-S3 7" CYD ESP32-8048S070C (Sunton) - 800x480 RGB ST7262, touch kapasitif GT911
; Demo: LVGL 9 "Widgets" (halaman Profile Elena Smith)
; Driver: rzeldent/esp32-smartdisplay (di-vendor + patch di lib/esp32_smartdisplay)

[platformio]
default_envs = esp32-8048S070C
boards_dir = boards

[env:esp32-8048S070C]
; esp32-smartdisplay butuh Arduino 2.x (ESP-IDF 4.4) -> espressif32 6.x
platform = espressif32@6.13.0
framework = arduino
board = esp32-8048S070C
; Env default: demo Widgets dari src/main.cpp, simple_demo.cpp tidak ikut
build_src_filter = +<*> -<simple_demo.cpp>

; Port otomatis terdeteksi. Kalau salah port, buka komentar & sesuaikan:
;upload_port = COM33
;monitor_port = COM33
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -Ofast
    -Wall
    '-D BOARD_NAME="${this.board}"'
    '-D LV_CONF_PATH="${platformio.include_dir}/lv_conf.h"'
    ; Semua define hardware board (pin LCD/touch/SD) ada di header ini
    -include include/board_8048S070C.h

lib_deps =
    lvgl/lvgl@9.6.0

[env:simple_demo]
extends = env:esp32-8048S070C
; Hanya simple_demo.cpp; demo LVGL + wrapper-nya tidak dikompilasi (firmware lebih kecil)
build_src_filter = +<*> -<main.cpp> -<lvgl_demo/>
